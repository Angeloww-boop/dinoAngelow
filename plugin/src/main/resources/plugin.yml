name: DinoEarth
version: 0.19.2
main: com.dinoearth.DinoEarthPlugin
api-version: '1.21'
description: Dinosaurios para Minecraft Earth
softdepend: [PlaceholderAPI, Vault, Towny, WorldGuard]
commands:
  dino:
    description: Comandos de DinoEarth
    usage: /dino <spawn|egg|grow|tame|nido|item|mis|llamar|misiones|top|carrera|dar|aceptar|rechazar|remove|count|stats|reload|comedero|dinopedia|hambre|pack>
permissions:
  dinoearth.limit.unlimited:
    description: Sin limite de dinos domesticados
    default: false
  dinoearth.admin:
    default: op
