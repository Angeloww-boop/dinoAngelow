# DinoEarth - configuracion

# Resource pack: el plugin se lo manda a cada jugador al entrar y calcula el hash solo.
# Si usás esto, sacá resource-pack y resource-pack-sha1 de server.properties (si no, se descarga dos veces).
resource-pack:
  # url  -> subiste DinoEarth-ResourcePack.zip a algún lado (mc-packs.net, GitHub, Dropbox con ?dl=1...)
  #         y pegás el link directo abajo. El plugin lo descarga al arrancar para sacarle el hash y te
  #         avisa en la consola si subiste uno viejo.
  # host -> el plugin sirve el pack que trae adentro, sin subir nada. Necesita un puerto abierto hacia
  #         afuera en la máquina del server (en muchos hostings hay que pedirlo o agregarlo en el panel).
  # off  -> no manda nada.
  mode: url
  url: ""
  host:
    port: 8163
    # IP o dominio con el que los jugadores llegan a ESTA máquina (no el de Velocity si está en otra)
    public-address: ""
  # true = quien rechace el pack no puede jugar
  required: false
  prompt: "Este servidor usa texturas de dinosaurios. ¡Aceptalas para verlos!"

# Minutos (con el chunk cargado) que tarda una cria en ser adulta
growth-minutes: 40

# Minutos que tarda un huevo en eclosionar
hatch-minutes: 5

# Minutos de espera entre una puesta de huevo y la siguiente
breed-cooldown-minutes: 5

# Hambre de los dinos domesticados (los salvajes no tienen). Muertos de hambre se echan,
# no se dejan montar ni crecen hasta que coman. Nunca se mueren de hambre.
hunger:
  enabled: true
  # Puntos que entran en un comedero (un trozo de carne = 6-10, un fardo = 45)
  feeder-capacity: 600

# Silbato de regreso: trae a tu lado dinos que estan lejos. Si el dino esta en un chunk descargado,
# se carga solo ese chunk un momento. Maximo de dinos por llamada y espera entre llamadas (por jugador).
recall:
  max-dinos: 2
  cooldown-minutes: 5

# Avisos al dueño cuando atacan a su dino estando lejos (las muertes se avisan siempre; si no esta
# conectado, le llegan al entrar).
alerts:
  attack-cooldown-seconds: 30

# Maximo de dinos domesticados por jugador (0 = sin limite). Cuentan todos los suyos, cargados o no; los que estan
# guardados en una jaula no cuentan (pero no se pueden soltar si ya tiene el maximo). Los huevos de un jugador que
# llego al maximo esperan a que tenga lugar para nacer.
# Para dar mas a algunos (VIP, rangos): permiso dinoearth.limit.<numero> (vale el mayor) o dinoearth.limit.unlimited
limits:
  max-tamed-per-player: 20

# Dinopedia: cada especie tiene sellos de investigacion (verla, sus colores, el color raro, domesticarla,
# criarla, montarla...). Cada sello da experiencia y completar una especie da mas. Los comandos se corren
# desde la consola (%player% = jugador, %species% = id de la especie), por ejemplo para dar plata o un kit.
dinopedia:
  xp-per-stamp: 30
  xp-species-complete: 150
  species-complete-commands: []
  all-complete-commands: []
  # Distancia a la que se anota un dino al verlo (con la Dinopedia en la mano, mas lejos)
  discover-range: 16
  book-discover-range: 32
  # Con la Dinopedia en la mano: huellas de especies que no conoces y rastreo con la lupa (en bloques)
  tracks-range: 64
  track-range: 160

# Valores por especie. Velocidades de montura en bloques por tick
# (un jugador caminando ~0.22, corriendo ~0.28).
species:
  raptor:
    hunger-minutes: 80       # de lleno a muerto de hambre
    health: 30
    damage: 6
    speed: 0.36
    tame-chance: 0.25        # por cada carne cruda
    ride:
      walk-speed: 0.32
      sprint-speed: 0.5
      jump: 0.58
  triceratops:
    hunger-minutes: 100      # de lleno a muerto de hambre
    health: 80
    damage: 9
    speed: 0.27
    tame-chance: 0.2         # por cada trigo, zanahoria, manzana, remolacha, bayas, sandía o fardo
    ride:
      walk-speed: 0.24
      sprint-speed: 0.36
      jump: 0.42
  dilophosaurus:
    health: 24
    damage: 5
    speed: 0.33
  compsognathus:
    health: 6
    damage: 2
    speed: 0.4
  trex:
    hunger-minutes: 70       # de lleno a muerto de hambre
    health: 160
    damage: 14
    speed: 0.3
    # no se domestica con comida: solo criándolo desde el huevo. Montado, espacio = rugido
    ride:
      walk-speed: 0.26
      sprint-speed: 0.42
  pteranodon:
    hunger-minutes: 80       # de lleno a muerto de hambre
    health: 28
    damage: 4
    speed: 0.3
    tame-chance: 0.2         # por cada bacalao, salmón o pez tropical crudo
    ride:
      walk-speed: 0.16       # caminando en el suelo
      sprint-speed: 0.22
      jump: 0.55             # impulso al despegar (con espacio)
      fly-speed: 0.55        # volando con W
      fly-sprint-speed: 0.9  # volando con W + Ctrl
  parasaurolophus:
    hunger-minutes: 100
    health: 60
    damage: 6
    speed: 0.3
    tame-chance: 0.15        # por cada planta (huye: acercate agachado)
    ride:
      walk-speed: 0.27
      sprint-speed: 0.42
      jump: 0.5
  gallimimus:
    hunger-minutes: 70
    health: 24
    damage: 3
    speed: 0.42
    tame-chance: 0.15        # por cada planta (huye: acercate agachado)
    ride:
      walk-speed: 0.36
      sprint-speed: 0.64     # la montura mas rapida
      jump: 0.62
  stegosaurus:
    hunger-minutes: 110
    health: 90
    damage: 10
    speed: 0.25
    tame-chance: 0.15
    ride:
      walk-speed: 0.22
      sprint-speed: 0.34
      jump: 0.4
  ankylosaurus:
    hunger-minutes: 110
    health: 110
    damage: 8
    speed: 0.22
    tame-chance: 0.15
    ride:
      walk-speed: 0.2
      sprint-speed: 0.3
      jump: 0.35
  giganotosaurus:
    hunger-minutes: 65
    health: 150
    damage: 15
    speed: 0.33
    # como el T-Rex: solo se domestica desde el huevo. Montado, espacio = rugido
    ride:
      walk-speed: 0.28
      sprint-speed: 0.46
  carnotaurus:
    hunger-minutes: 80
    health: 45
    damage: 8
    speed: 0.4
    tame-chance: 0.12        # por cada carne cruda
    ride:
      walk-speed: 0.34
      sprint-speed: 0.56
      jump: 0.55
  dimorphodon:
    hunger-minutes: 90
    health: 10
    damage: 2
    speed: 0.32
    tame-chance: 0.33        # por cada pescado crudo
