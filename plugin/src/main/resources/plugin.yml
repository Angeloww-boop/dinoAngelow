name: DinoEarth
version: 0.13.0
main: com.dinoearth.DinoEarthPlugin
api-version: '1.21'
description: Dinosaurios para Minecraft Earth
commands:
  dino:
    description: Comandos de DinoEarth
    usage: /dino <spawn|egg|grow|tame|item|mis|llamar|misiones|dar|aceptar|rechazar|remove|count|stats|reload|comedero|dinopedia|hambre|pack>
permissions:
  dinoearth.limit.unlimited:
    description: Sin limite de dinos domesticados
    default: false
  dinoearth.admin:
    default: op
