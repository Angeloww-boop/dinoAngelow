# DinoEarth - configuracion

# Resource pack: el plugin se lo manda a cada jugador al entrar y calcula el hash solo.
# Si usás esto, sacá resource-pack y resource-pack-sha1 de server.properties (si no, se descarga dos veces).
resource-pack:
  # url  -> subiste DinoEarth-ResourcePack.zip a algún lado (mc-packs.net, GitHub, Dropbox con ?dl=1...)
  #         y pegás el link directo abajo. El plugin lo descarga al arrancar para sacarle el hash y te
  #         avisa en la consola si subiste uno viejo.
  # host -> el plugin sirve el pack que trae adentro, sin subir nada. Necesita un puerto abierto hacia
  #         afuera en la máquina del server (en muchos hostings hay que pedirlo o agregarlo en el panel).
  # off  -> no manda nada.
  mode: url
  url: ""
  host:
    port: 8163
    # IP o dominio con el que los jugadores llegan a ESTA máquina (no el de Velocity si está en otra)
    public-address: ""
  # true = quien rechace el pack no puede jugar
  required: false

# Minutos (con el chunk cargado) que tarda una cria en ser adulta
growth-minutes: 40

# Minutos que tarda un huevo en eclosionar
hatch-minutes: 5

# Minutos de espera entre una puesta de huevo y la siguiente
breed-cooldown-minutes: 5

# Hambre de los dinos domesticados (los salvajes no tienen). Muertos de hambre se echan,
# no se dejan montar ni crecen hasta que coman. Nunca se mueren de hambre.
hunger:
  enabled: true
  # Puntos que entran en un comedero (un trozo de carne = 6-10, un fardo = 45)
  feeder-capacity: 600

# Silbato de regreso: trae a tu lado dinos que estan lejos. Si el dino esta en un chunk descargado,
# se carga solo ese chunk un momento. Maximo de dinos por llamada y espera entre llamadas (por jugador).
recall:
  max-dinos: 2
  cooldown-minutes: 5

# Avisos al dueño cuando atacan a su dino estando lejos (las muertes se avisan siempre; si no esta
# conectado, le llegan al entrar).
alerts:
  attack-cooldown-seconds: 30

# Misiones diarias de la Dinopedia: 3 por jugador, distintas para cada uno, que cambian todos los dias a la hora
# reset-hour (en la zona horaria timezone). Solo piden especies que alguien vio en el server en los ultimos
# recent-days dias (o que estan cargadas ahora). Cada jugador puede cambiar rerolls-per-day misiones por dia.
# Premios: experiencia y comandos de consola por cada mision y por completar las 3 (%player% = jugador,
# %mision% = tipo de mision). Los textos estan en messages.yml, textos.yml y menus/dinopedia.yml.
missions:
  timezone: 'America/Argentina/Buenos_Aires'
  reset-hour: 0
  rerolls-per-day: 1
  recent-days: 3
  reward-xp: 100
  reward-money: 0           # plata con Vault (0 = nada)
  reward-commands: []
  all-done-xp: 200
  all-done-money: 0
  all-done-commands: []

# Maximo de dinos domesticados por jugador (0 = sin limite). Cuentan todos los suyos, cargados o no; los que estan
# guardados en una jaula no cuentan (pero no se pueden soltar si ya tiene el maximo). Los huevos de un jugador que
# llego al maximo esperan a que tenga lugar para nacer.
# Para dar mas a algunos (VIP, rangos): permiso dinoearth.limit.<numero> (vale el mayor) o dinoearth.limit.unlimited
# Carreras parejas: la pista presta a todos el mismo dino (misma especie y genetica neutra). Las pistas se arman con
# /dino carrera (ver /dino carrera para la ayuda) y se guardan en carreras.yml. Los jugadores se anotan con un NPC
# (FancyNpcs: accion de comando del jugador "dino carrera unirse <pista>") o con el comando.
races:
  min-players: 2
  # cuando ya hay el minimo, se espera esto para que se sumen mas (si se llena, larga al toque)
  lobby-seconds: 30
  # si en este tiempo no se junta el minimo, la inscripcion se cancela
  lobby-timeout-minutes: 3
  countdown-seconds: 10
  # despues de que llega el primero, los demas tienen este tiempo para terminar
  finish-wait-seconds: 30
  default-laps: 3
  default-species: gallimimus
  # correr (Ctrl) gasta la estamina en sprint-seconds; vacia no deja correr hasta recuperar el 30 %
  stamina:
    sprint-seconds: 6
    regen-seconds: 10
  # carreras programadas: a estas horas (zona de missions.timezone) o cada every-minutes minutos (0 = no)
  # track = pista de las programadas ('' = van rotando todas las pistas listas)
  schedule:
    track: ''
    times: []
    every-minutes: 0
    announce-minutes: 5
  # premios por puesto ('1', '2', '3') y para el resto de los que terminan ('finish').
  # money necesita Vault; commands: %player%, %pista%, %puesto%
  rewards:
    '1':
      xp: 300
      money: 0
      commands: []
    '2':
      xp: 200
      money: 0
      commands: []
    '3':
      xp: 100
      money: 0
      commands: []
    finish:
      xp: 50
      money: 0
      commands: []

# Linea Plus (dinos con habilidad, solo de huevo: /dino egg <especie_plus> [cantidad] [jugador]). Se activan montado
# con click derecho (con cualquier item en la mano) o con la tecla de cambiar de mano (F). Tiempos en segundos.
plus:
  cooldowns:
    dash: 8
    cosecha: 20
    pesca: 60
    canto: 60
    turbo: 10
    arranque: 30
    tala: 12
  dash:
    speed: 1.3
  arranque:
    multiplier: 1.6
  turbo:
    multiplier: 1.8
  # cosecha pasiva (quieto o patrullando) y activa (montado)
  cosecha:
    radius: 3
    active-radius: 5
    every-seconds: 3
  pesca:
    every-seconds: 45
  buscador:
    radius: 6
  tala:
    max-blocks: 96

limits:
  max-tamed-per-player: 20

# Genetica: cada dino tiene tres rasgos (vida, velocidad y tamaño; 1 = normal) que cambian sus stats. Los salvajes
# nacen con rasgos al azar; las crias sacan el promedio de los padres con un poco de variacion, asi criando a los
# mejores se consiguen dinos mejores. El color sale de uno de los padres, a veces uno cualquiera, y con
# mutation-chance el color raro. Con enabled: false se siguen guardando pero no cambian nada.
genetics:
  enabled: true
  wild-variation: 0.05       # cuanto varian los salvajes (0.05 = la mayoria entre 90 % y 110 %)
  variation: 0.04            # cuanto varian las crias respecto del promedio de los padres
  jump-chance: 0.1           # probabilidad de que una cria varie el doble y medio (para bien o para mal)
  min: 0.8                   # ningun rasgo baja de 80 % ...
  max: 1.3                   # ... ni pasa de 130 %
  mutation-chance: 0.03      # probabilidad de que la cria salga del color raro (albino)
  random-color-chance: 0.08  # probabilidad de que salga de un color cualquiera de la especie

# Nidos salvajes: las hembras adultas salvajes de las especies con huevo arman un nido cada tanto y lo cuidan.
# Se le puede sacar un huevo con click izquierdo (la cria nace domesticada por quien lo pone), pero la madre
# ataca a quien se acerca o le roba. Es la forma de conseguir T-Rex y Giganotosaurus sin admins.
# Spawn natural en el mapa de la Tierra a escala: cada especie aparece donde se encontraron sus fosiles de verdad.
# Cada "interval-seconds", por cada jugador en survival/aventura hay "chance" de que aparezca un grupo a sus
# espaldas, entre min-distance y max-distance bloques, solo en chunks ya cargados y (only-wilderness) fuera de pueblos
# de Towny y regiones de WorldGuard. /dino mapa dice donde estas y que puede aparecer ahi.
natural-spawn:
  enabled: true
  worlds: []                 # vacio = todos los mundos normales (overworld); si no, ej. [world]
  interval-seconds: 30
  chance: 0.4
  min-distance: 40
  max-distance: 80
  behind-player: true        # que aparezcan a la espalda del jugador y no en su cara
  near-radius: 128
  max-near-player: 4         # salvajes naturales como maximo cerca de cada jugador
  max-total: 120             # salvajes naturales cargados como maximo en todo el server
  only-wilderness: true
  # si nadie se les acerca a menos de despawn-radius bloques por despawn-minutes, desaparecen (los domesticados,
  # atados, prestados y las madres con nido nunca)
  despawn-minutes: 5
  despawn-radius: 128
  # Calibracion del mapa (equirectangular): x = blocks-per-degree-x * longitud + x-at-longitude-0,
  # z = z-at-latitude-0 - blocks-per-degree-z * latitud. Sale de las esquinas del mapa: de -36864 -18431 (180 O, 90 N)
  # a 36863 18431 (180 E, 90 S) son 73728 x 36864 bloques = 204.8 bloques por grado, con el centro en 0 0.
  map:
    blocks-per-degree-x: 204.8
    x-at-longitude-0: 0
    blocks-per-degree-z: 204.8
    z-at-latitude-0: 0
  # agua honda (en cualquier lado del mapa): especies acuaticas
  ocean:
    chance: 0.5
    min-depth: 4
    species:
      mosasaurus: 1
  # tierra fuera de todas las regiones: unas pocas especies comunes, menos seguido
  elsewhere:
    chance: 0.35
    species:
      compsognathus: 3
      gallimimus: 1
      parasaurolophus: 1
      triceratops: 1
      raptor: 1
  # regiones del mundo real: latitud y longitud [desde, hasta] (sur y oeste en negativo). Si se superponen,
  # se suman sus especies. El numero de cada especie es su peso (mas alto = mas seguido).
  regions:
    patagonia:                       # Neuquen y Chubut
      latitude: [-56, -33]
      longitude: [-76, -62]
      species:
        giganotosaurus: 1
        carnotaurus: 3
    oeste-norteamerica:              # Montana, Wyoming, Dakota, Colorado, Utah, Alberta
      latitude: [34, 56]
      longitude: [-122, -100]
      species:
        trex: 1
        triceratops: 4
        ankylosaurus: 2
        parasaurolophus: 3
        stegosaurus: 3
    sudoeste-eeuu:                   # Arizona
      latitude: [31, 37.5]
      longitude: [-115, -107]
      species:
        dilophosaurus: 4
    grandes-llanuras:                # Kansas
      latitude: [36, 42]
      longitude: [-102, -94]
      species:
        pteranodon: 3
    gobi:                            # Mongolia
      latitude: [38, 50]
      longitude: [88, 118]
      species:
        raptor: 4
        gallimimus: 4
    norte-africa:                    # Marruecos y Egipto
      latitude: [18, 36]
      longitude: [-14, 34]
      species:
        spinosaurus: 2
    europa-central:                  # Alemania y Francia
      latitude: [43, 55]
      longitude: [-2, 16]
      species:
        compsognathus: 4
    inglaterra:
      latitude: [49.5, 56]
      longitude: [-7, 2]
      species:
        dimorphodon: 3

nests:
  enabled: true
  chance: 0.15               # probabilidad por minuto de que una hembra salvaje sin nido arme uno
  max-eggs: 3
  spacing: 48                # bloques minimos entre nidos
  max-loaded: 12             # nidos cargados a la vez como maximo en todo el server
  lifetime-minutes: 90       # despues de esto el nido se deshace (si no hay nadie cerca)
  cooldown-minutes: 60       # espera de la hembra entre un nido y el siguiente
  guard-range: 10            # a cuantos bloques del nido la madre ataca (agachado: la mitad)
  only-wilderness: true      # solo fuera de pueblos de Towny y regiones de WorldGuard
  species: []                # vacio = todas las que ponen huevos; si no, ej. [trex, giganotosaurus, raptor]

# Dinopedia: cada especie tiene sellos de investigacion (verla, sus colores, el color raro, domesticarla,
# criarla, montarla...). Cada sello da experiencia y completar una especie da mas. Los comandos se corren
# desde la consola (%player% = jugador, %species% = id de la especie), por ejemplo para dar plata o un kit.
dinopedia:
  xp-per-stamp: 30
  xp-species-complete: 150
  species-complete-commands: []
  all-complete-commands: []
  # plata (Vault) por sello y por especie completa, 0 = nada
  money-per-stamp: 0
  money-species-complete: 0
  # Distancia a la que se anota un dino al verlo (con la Dinopedia en la mano, mas lejos)
  discover-range: 16
  book-discover-range: 32
  # Con la Dinopedia en la mano: huellas de especies que no conoces y rastreo con la lupa (en bloques)
  tracks-range: 64
  track-range: 160

# Integraciones (se activan solas si el plugin esta instalado):
# - PlaceholderAPI: %dinoearth_...% para scoreboards, hologramas y tops (lista en el README).
# - Vault: plata en misiones y sellos (missions.reward-money, dinopedia.money-per-stamp...).
# - Towny / WorldGuard: los nidos solo aparecen fuera de pueblos y regiones (nests.only-wilderness).
# Tops: /dino top <categoria>. Se guardan en jugadores.yml; top-size = cuantos muestra.
tops:
  top-size: 10

# Valores por especie. Velocidades de montura en bloques por tick
# (un jugador caminando ~0.22, corriendo ~0.28).
species:
  raptor:
    hunger-minutes: 80       # de lleno a muerto de hambre
    health: 30
    damage: 6
    speed: 0.36
    tame-chance: 0.25        # por cada carne cruda
    ride:
      walk-speed: 0.32
      sprint-speed: 0.5
      jump: 0.58
  triceratops:
    hunger-minutes: 100      # de lleno a muerto de hambre
    health: 80
    damage: 9
    speed: 0.27
    tame-chance: 0.2         # por cada trigo, zanahoria, manzana, remolacha, bayas, sandía o fardo
    ride:
      walk-speed: 0.24
      sprint-speed: 0.36
      jump: 0.42
  dilophosaurus:
    health: 24
    damage: 5
    speed: 0.33
  compsognathus:
    health: 6
    damage: 2
    speed: 0.4
  trex:
    hunger-minutes: 70       # de lleno a muerto de hambre
    health: 160
    damage: 14
    speed: 0.3
    # no se domestica con comida: solo criándolo desde el huevo. Montado, espacio = rugido
    ride:
      walk-speed: 0.26
      sprint-speed: 0.42
  pteranodon:
    hunger-minutes: 80       # de lleno a muerto de hambre
    health: 28
    damage: 4
    speed: 0.3
    tame-chance: 0.2         # por cada bacalao, salmón o pez tropical crudo
    ride:
      walk-speed: 0.16       # caminando en el suelo
      sprint-speed: 0.22
      jump: 0.55             # impulso al despegar (con espacio)
      fly-speed: 0.55        # volando con W
      fly-sprint-speed: 0.9  # volando con W + Ctrl
  parasaurolophus:
    hunger-minutes: 100
    health: 60
    damage: 6
    speed: 0.3
    tame-chance: 0.15        # por cada planta (huye: acercate agachado)
    ride:
      walk-speed: 0.27
      sprint-speed: 0.42
      jump: 0.5
  gallimimus:
    hunger-minutes: 70
    health: 24
    damage: 3
    speed: 0.42
    tame-chance: 0.15        # por cada planta (huye: acercate agachado)
    ride:
      walk-speed: 0.36
      sprint-speed: 0.64     # la montura mas rapida
      jump: 0.62
  stegosaurus:
    hunger-minutes: 110
    health: 90
    damage: 10
    speed: 0.25
    tame-chance: 0.15
    ride:
      walk-speed: 0.22
      sprint-speed: 0.34
      jump: 0.4
  ankylosaurus:
    hunger-minutes: 110
    health: 110
    damage: 8
    speed: 0.22
    tame-chance: 0.15
    ride:
      walk-speed: 0.2
      sprint-speed: 0.3
      jump: 0.35
  giganotosaurus:
    hunger-minutes: 65
    health: 150
    damage: 15
    speed: 0.33
    # como el T-Rex: solo se domestica desde el huevo. Montado, espacio = rugido
    ride:
      walk-speed: 0.28
      sprint-speed: 0.46
  carnotaurus:
    hunger-minutes: 80
    health: 45
    damage: 8
    speed: 0.4
    tame-chance: 0.12        # por cada carne cruda
    ride:
      walk-speed: 0.34
      sprint-speed: 0.56
      jump: 0.55
  dimorphodon:
    hunger-minutes: 90
    health: 10
    damage: 2
    speed: 0.32
    tame-chance: 0.33        # por cada pescado crudo
  spinosaurus:
    hunger-minutes: 80
    health: 140
    damage: 13
    speed: 0.3
    tame-chance: 0.1         # por cada pescado crudo
    ride:
      walk-speed: 0.26
      sprint-speed: 0.42
      jump: 0.5
      swim-speed: 0.32       # nadando con W
      swim-sprint-speed: 0.5 # nadando con W + Ctrl
  mosasaurus:
    hunger-minutes: 90
    health: 170
    damage: 16
    speed: 0.06              # en tierra (varado) casi no se mueve
    tame-chance: 0.08        # por cada pescado crudo, mejor desde un bote
    ride:
      walk-speed: 0.04
      sprint-speed: 0.06
      swim-speed: 0.42
      swim-sprint-speed: 0.68
