# Dinopedia. Es la excepcion al formato de menu: el fondo va dibujado (libreta de paleontologo) en el titulo, por
# eso no hay menu_title ni relleno. Los textos que se escriben SOBRE la pagina estan en "textos" (sin colores: se
# escriben con tinta). El nombre y el lore de cada item siguen el formato normal.
